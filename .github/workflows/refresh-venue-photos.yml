name: Refresh venue photos

# Re-scrapes every venue's official wedding page and Wikimedia source for any
# venues that don't already have a valid local image. The script is idempotent
# — it only downloads what's missing, so re-runs are cheap.

on:
  schedule:
    # 18:00 UTC = 02:00 HKT (Hong Kong is UTC+8). Adjust if you'd prefer a
    # different hour. GitHub may delay scheduled runs by 5-30 min under load.
    - cron: "0 18 * * *"

  # Manual run from the Actions tab. Optional input lets you target a single
  # venue id, e.g. when debugging a specific scrape.
  workflow_dispatch:
    inputs:
      only_venue:
        description: "Run for a single venue id (optional, e.g. tai-kwun-the-rooms)"
        required: false
        default: ""

# Prevent overlapping runs (e.g. a manual run during the nightly cron).
concurrency:
  group: refresh-venue-photos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # We push back to main with the same token, so default token works.
          fetch-depth: 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run venue photo scraper
        env:
          ONLY_VENUE: ${{ inputs.only_venue }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY_VENUE:-}" ]; then
            echo "Scraping single venue: $ONLY_VENUE"
            npx tsx scripts/fetch-venue-photos.ts --venue="$ONLY_VENUE"
          else
            echo "Scraping all venues that don't already have a local image."
            npx tsx scripts/fetch-venue-photos.ts
          fi

      - name: Regenerate venue-lines.json (line numbers shift when photos are added)
        run: npx tsx scripts/build-venue-lines.ts

      - name: Typecheck (safety gate — never push a broken venues.ts)
        run: npx tsc -b

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          git add public/venue-photos/ src/data/venues.ts src/data/venue-lines.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✓ No new photos this run."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes staged:"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ts=$(date -u +"%Y-%m-%d")
          git commit \
            -m "chore(photos): nightly venue photo refresh ($ts)" \
            -m "Auto-generated by .github/workflows/refresh-venue-photos.yml. Re-run safely; the script skips venues that already have a valid local image."
          # In case a developer pushed during the run, rebase before pushing.
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "## Refresh summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changes pushed: **${{ steps.changes.outputs.has_changes }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run mode: ${{ inputs.only_venue && format('single venue = {0}', inputs.only_venue) || 'all venues' }}" >> "$GITHUB_STEP_SUMMARY"
